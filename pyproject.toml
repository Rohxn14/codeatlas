[build-system]
# 77 is the first setuptools that reads an SPDX `license` string (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas"
version = "0.1.0"
description = "An honest, multi-language map of any public repository, with impact analysis and an agent on top."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    # Parsing: the tree-sitter runtime plus one wheel per grammar. Each wheel ships a
    # compiled grammar and, for these languages, its upstream tags query.
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-go>=0.25",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-rust>=0.24",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-php>=0.24",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-scala>=0.24",
    "tree-sitter-lua>=0.4",
    "tree-sitter-swift>=0.7",
    "tree-sitter-elixir>=0.3",
    # Graph, search and file handling
    "networkx>=3.3",
    "numpy>=1.26",
    "pathspec>=0.12",
    "pyyaml>=6.0",
    "fastembed>=0.4",
    # LLM providers and HTTP
    "groq>=0.11",
    "google-genai>=1.0",
    "httpx>=0.27",
    # Reads the LLM keys from a gitignored .env at the command line (D-45)
    "python-dotenv>=1.0",
    # Model Context Protocol server (Wave 3). The server uses the 2.x low-level API
    # (`Server(on_list_tools=..., on_call_tool=...)`); 1.x registers handlers differently.
    "mcp>=2",
]

[project.optional-dependencies]
# The local web app (`codeatlas serve`). Optional, so a plain install stays small.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # The web extra again, because the tests exercise the app.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.scripts]
codeatlas = "codeatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codeatlas = [
    "indexer/queries/**/*.scm",
    "indexer/queries/**/*.md",
    "web/templates/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs the network or a real LLM API; skipped unless selected with -m live",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/data", "eval/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
