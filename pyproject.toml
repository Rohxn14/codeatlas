[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas"
version = "0.1.0"
description = "An honest, labelled map of any public repository: packages, files, symbols, calls, tests and history."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Parsing: the tree-sitter runtime plus one grammar package per structural language.
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-ruby>=0.23",
    # Graph, vectors and file matching.
    "networkx>=3.2",
    "numpy>=1.26",
    "pathspec>=0.12",
    "pyyaml>=6.0",
    # LLM layer, embeddings and the MCP server.
    "fastembed>=0.4",
    "groq>=0.11",
    "google-genai>=1.0",
    "httpx>=0.27",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
codeatlas = "codeatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"codeatlas.indexer" = ["queries/*/*.scm", "queries/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: needs the network or a real LLM API; skipped by default (run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
