{# Small line icons, drawn here so the app loads nothing from anywhere else. Each has its size
   in the tag: without one, a page shown before its stylesheet draws it as wide as the window. #}
{% macro icon(name) %}
<svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
{%- if name == "map" %}<rect x="3" y="3" width="7" height="6" rx="1.5"/><rect x="14" y="3" width="7" height="6" rx="1.5"/><rect x="8.5" y="15" width="7" height="6" rx="1.5"/><path d="M6.5 9v2.5h11V9M12 11.5V15"/>
{%- elif name == "search" %}<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>
{%- elif name == "impact" %}<circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="19" cy="12" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M7.2 12h9.6M7 11l10-5M7 13l10 5"/>
{%- elif name == "coverage" %}<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif name == "ask" %}<path d="M4 5h16v11H9l-5 4z"/>
{%- elif name == "all" %}<path d="m15 6-6 6 6 6"/>
{%- elif name == "open" %}<path d="m9 6 6 6-6 6"/>
{%- elif name == "close" %}<path d="m6 6 12 12M18 6 6 18"/>
{%- elif name == "send" %}<path d="M12 20V5M5.5 11.5 12 5l6.5 6.5"/>
{%- elif name == "page" %}<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>
{%- endif %}
</svg>
{% endmacro %}
{% macro logo() %}<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7z" fill="none" stroke="#388bfd" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 12 20.5 7M12 12v9.5M12 12 3.5 7" stroke="#388bfd" stroke-width="1.8" stroke-linejoin="round"/></svg>{% endmacro %}
