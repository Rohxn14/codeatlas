<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CodeAtlas{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">CodeAtlas</a>
    {% if snapshot %}
    <nav aria-label="Repository">
      <span class="repo">{{ snapshot.repo }}</span>
      <a href="/s/{{ snapshot.id | slug }}/"{% if tab == "map" %} aria-current="page"{% endif %}>Map</a>
      <a href="/s/{{ snapshot.id | slug }}/impact"{% if tab == "impact" %} aria-current="page"{% endif %}>Impact</a>
      <a href="/s/{{ snapshot.id | slug }}/coverage"{% if tab == "coverage" %} aria-current="page"{% endif %}>Coverage</a>
      {% if not read_only %}<a href="/s/{{ snapshot.id | slug }}/ask"{% if tab == "ask" %} aria-current="page"{% endif %}>Ask</a>{% endif %}
    </nav>
    <form class="search" action="/s/{{ snapshot.id | slug }}/search" role="search">
      <input type="search" name="q" value="{{ q | default("") }}" placeholder="Search symbols and files" aria-label="Search symbols and files">
    </form>
    {% endif %}
    <a class="topbar-end" href="/snapshots">All repositories</a>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
  <footer>
    CodeAtlas {{ version }}. Built by reading code, never by running it.
  </footer>
</body>
</html>
