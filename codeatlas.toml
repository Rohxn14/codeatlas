# CodeAtlas settings. Every value here is the default; delete a line to keep it.
# Read from the folder you run `codeatlas` in (or `--config path`), never from an
# indexed repository, so a repository cannot raise its own limits.

[limits]
# A guard, far above any repository indexed so far. At max_files or max_seconds indexing
# stops, keeps what it has and names the limit in the snapshot's `limits_hit`.
max_files = 200000         # files per index, of any language
max_file_bytes = 5000000   # a longer text file is searchable but not parsed into symbols
max_seconds = 3600         # wall-clock time per index

[history]
max_history_commits = 2000 # commits read for co-change analysis (repository layer)

[paths]
data_dir = ".codeatlas"    # clones, indexes and caches
